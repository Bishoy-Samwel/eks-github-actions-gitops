name: oidc-verify

# Temporary step-1 verification. Proves the trust boundary:
#   - on main          -> assume succeeds
#   - on any other ref -> assume fails with Not authorized
# Delete this file once verified.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  assume-ci-ecr-push:
    runs-on: ubuntu-latest
    steps:
      - name: Decode the OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042617239394:role/myapp-ci-ecr-push
          aws-region: eu-central-1

      - name: Who am I
        run: aws sts get-caller-identity
